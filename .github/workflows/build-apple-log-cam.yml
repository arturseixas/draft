name: Build Apple Log Cam APK

on:
  push:
    branches: [apple-log-cam]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AppleLogCam
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Publish error tail as annotation
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |^w: .*(Unresolved|Type mismatch)|error:|What went wrong|Could not|Execution failed|FAILURE|Caused by|not found|SDK" "$RUNNER_TEMP/build.log" | head -n 40 | cut -c1-400 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}1' > "$RUNNER_TEMP/msg.txt"
          echo "::error title=GradleErrors::$(cat "$RUNNER_TEMP/msg.txt")"
          tail -n 25 "$RUNNER_TEMP/build.log" | cut -c1-300 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}1' > "$RUNNER_TEMP/tail.txt"
          echo "::error title=GradleTail::$(cat "$RUNNER_TEMP/tail.txt")"

      - uses: actions/upload-artifact@v4
        with:
          name: AppleLogCam-debug-apk
          path: AppleLogCam/app/build/outputs/apk/debug/app-debug.apk
